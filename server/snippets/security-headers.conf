# Security headers for davidnavratil.com
#
# THIS FILE IS THE SOURCE OF TRUTH. It is deployed to
# /etc/nginx/snippets/security-headers.conf by scripts/update-csp.mjs.
# Do not hand-edit the copy on the server; it will be overwritten.
#
# Why a snippet and not just server-level add_header: nginx `add_header`
# does not inherit into a location block that declares its own add_header.
# Every location that sets Cache-Control must therefore re-include this file,
# or it would silently serve pages with no security headers at all.
#
# Note on `index index.html`: a request for "/" is internally redirected to
# "/index.html", which re-runs location matching and lands in the
# `location ~* \.html$` block. That is why this snippet, not the server-level
# header, is what browsers actually receive on every HTML page.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# The contact form is submitted with fetch() to our own /api/poptavka, so
# connect-src 'self' is enough (Formspree was dropped in 2026-11 and removed
# from the list). form-action stays 'self': a script injected into a page
# still cannot repoint a native form POST at an attacker's collector.
# Analyses under /analyses/ get their own CSP in the nginx site config (they need
# esm.sh and chart CDNs). The main site loads no third-party scripts except
# Plausible, so cdn.tailwindcss.com and esm.sh were dropped here on 2026-11-22.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://substackcdn.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://plausible.io; frame-src 'none'; base-uri 'self'; form-action 'self';" always;
