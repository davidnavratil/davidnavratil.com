# Security headers for davidnavratil.com
#
# THIS FILE IS THE SOURCE OF TRUTH. It is deployed to
# /etc/nginx/snippets/security-headers.conf by scripts/update-csp.mjs.
# Do not hand-edit the copy on the server; it will be overwritten.
#
# Why a snippet and not just server-level add_header: nginx `add_header`
# does not inherit into a location block that declares its own add_header.
# Every location that sets Cache-Control must therefore re-include this file,
# or it would silently serve pages with no security headers at all.
#
# Note on `index index.html`: a request for "/" is internally redirected to
# "/index.html", which re-runs location matching and lands in the
# `location ~* \.html$` block. That is why this snippet, not the server-level
# header, is what browsers actually receive on every HTML page.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# connect-src must list https://formspree.io: the contact form is submitted
# with fetch(). We deliberately do NOT widen form-action to formspree.io —
# keeping form-action 'self' means a script injected into a page still cannot
# repoint a native form POST at an attacker's collector.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io https://cdn.tailwindcss.com https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://substackcdn.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://plausible.io https://esm.sh https://formspree.io; frame-src 'none'; base-uri 'self'; form-action 'self';" always;
